services:
  - type: web
    name: emuplcoom-bot
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.0
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
